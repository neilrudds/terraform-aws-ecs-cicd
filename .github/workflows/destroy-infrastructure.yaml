name: Destroy ECS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm-destroy:
        description: 'Type "DESTROY" to confirm infrastructure destruction'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.13.4

jobs:
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        # Terraform files are in the terraform directory
        working-directory: ./terraform

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with: 
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform init
      id: init
      run: terraform init

    - name: Confirm destruction input
      id: confirm
      run: |
        if [ "${{ github.event.inputs.confirm-destroy }}" != "DESTROY" ]; then
          echo "Destruction not confirmed. Exiting."
          exit 1
        fi

    - name: Terraform plan for destroy
      id: plan-destroy
      run: terraform plan -destroy -out=tfplan-destroy

    - name: Terraform destroy
      id: destroy
      run: terraform destroy -auto-approve tfplan-destroy

    - name: Summary
      run: echo "## Infrastructure destroyed successfully!" >> $GITHUB_STEP_SUMMARY