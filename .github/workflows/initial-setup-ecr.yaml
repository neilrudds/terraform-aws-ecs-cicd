name: Setup ECR repo and push first image

on:
  workflow_dispatch:
    inputs:
      create_repository:
        description: 'Create the ECR repo if it does not already exist'
        required: true
        default: true
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 151482153576.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: tf01-nodeweb01

jobs:
  setup-and-push:
    name: Setup ECR repo and push initial image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create ECR repo if does not exist
      if: ${{ github.event.inputs.create_repository == 'true' }}
      run: |
        echo "Checking if ECR Private repo exists..."

        # Check if repo exists
        if aws ecr-private describe-repositories --repository-names $ECR_REPOSITORY --region us-east-1 2>/dev/null; then
          echo "Repo $ECR_REPOSITORY already exists"
        else
          echo "Creating private ECR repo: $ECR_REPOSITORY"

          # Try different approaches for repository creation
          if aws ecr-private create-repository \
            --repository-name $ECR_REPOSITORY \
            --region us-east-1 2>/dev/null; then
            echo "Repository created successfully (basic)"
          fi
        fi

    - name: Login to AWS private ECR
      id: login-ecr-private
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: private
        mask-password: 'true'

    - name: Build and push Docker image
      working-directory: ./app
      run: |
        # Generate initial image tag
        INITIAL_TAG="v1.0.0"
        IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$INITIAL_TAG"
        LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
        
        echo "Building initial image: $IMAGE_URI"
        
        # Build the Docker image
        docker build -t $IMAGE_URI .
        docker tag $IMAGE_URI $LATEST_URI
        
        # Push both tagged and latest versions
        docker push $IMAGE_URI
        docker push $LATEST_URI
        
        echo "## Initial ECR Setup Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**ECR Repository:** \`$ECR_REPOSITORY\`" >> $GITHUB_STEP_SUMMARY
        echo "**Initial Image:** \`$IMAGE_URI\`" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** \`$ECR_REGISTRY\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Repository is ready for infrastructure deployment." >> $GITHUB_STEP_SUMMARY

    - name: Verify image in ECR
      run: |
        echo "Verifying images in ECR repository..."
        aws ecr-private describe-images \
          --repository-name $ECR_REPOSITORY \
          --region us-east-1 \
          --query 'imageDetails[*].[imageTags[0],imagePushedAt]' \
          --output table