name: Setup ECR repo and push first image

on:
  workflow_dispatch:
    inputs:
      create_repository:
        description: 'Create the ECR repo if it does not already exist'
        required: true
        default: true
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/t1v3g1m3
  ECR_REPOSITORY: nodeweb01

jobs:
  setup-and-push:
    name: Setup ECR repo and push initial image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create ECR repo if does not exist
      if: ${{ github.event.inputs.create_repository == 'true' }}
      run: |
        echo "Checking if ECR Public repo exists..."

        # Check if repo exists
        if aws ecr-public describe-repositories --repository-names $ECR_REPOSITORY --region us-east-1 2>/dev/null; then
          echo "Repo $ECR_REPOSITORY already exists"
        else
          echo "Creating public ECR repo: $ECR_REPOSITORY"

          # Try different approaches for repository creation
          if aws ecr-public create-repository \
            --repository-name $ECR_REPOSITORY \
            --region us-east-1 2>/dev/null; then
            echo "Repository created successfully (basic)"
          fi
        fi

    - name: Login to AWS public ECR
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public
        mask-password: 'true'

    - name: Build and push Docker image
      working-directory: ./app
      run: |
        # Generate initial image tag
        INITIAL_TAG="v1.0.0"
        IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$INITIAL_TAG"
        LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

        echo "Building image: $IMAGE_URI"

        # Building Docker image
        docker build -t #IMAGE_URI .
        docker tag $IMAGE_URI $LATEST_URI

        # Push both tagged and latest versions
        docker push $IMAGE_URI
        docker push $LATEST_URI

        echo "## Initial ECR Setup Complete!" >> $GITHUB_STEP_SUMMARY

    - name: Verify image in ECR
      run: |
        echo "Verifying images in ECR repository..."
        aws ecr-public describe-images \
          --repository-name $ECR_REPOSITORY \
          --region us-east-1 \
          --query 'imageDetails[*].[imageTags[0],imagePushedAt]' \
          --output table